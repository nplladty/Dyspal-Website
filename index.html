  <script>
    // Signature Loading: sembunyikan Hero sebelum paint pertama (anti white-flash / double fade-in).
    // Hanya pada kunjungan pertama per sesi, tanpa reduced-motion, tanpa deep-link anchor.
    (function () {
      try {
        var deep = location.hash && location.hash !== '#top';
        var seen = sessionStorage.getItem('dyspal-intro-seen') === '1';
        var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (deep || seen || rm) return;
        var h = document.documentElement;
        h.classList.add('intro-on');
        // Safety: jika JS modul gagal dimuat, website tetap tampil.
        setTimeout(function () { h.classList.remove('intro-on'); }, 4000);
      } catch (e) { /* abaikan */ }
    })();
  </script>
