</div><noscript><section aria-label="Kebijakan privasi website | Dyspal"><p><strong>Kebijakan privasi website | Dyspal</strong></p><p>Pelajari data yang disimpan website Dyspal di browser, informasi yang dikirim melalui Formspree, dan tautan menuju layanan eksternal.</p><section><h2>Saat mengunjungi website</h2><p>Browser meminta halaman, gambar, font, dan informasi rilis publik dari penyedia hosting website. Penyedia hosting menerima data koneksi seperti alamat IP Anda. Kode website tidak memasang cookie pelacakan atau memuat skrip analitik maupun iklan.</p></section><section><h2>Data di browser ini</h2><p>Pilihan bahasa dan acara yang Anda tambahkan ke kalender demo tersimpan di penyimpanan lokal browser untuk kunjungan berikutnya. Penyimpanan sesi menandai apakah intro sudah diputar di tab ini. Untuk menghapusnya, bersihkan data situs ini melalui pengaturan browser. Simulator menggunakan contoh media dan statistik sistem.</p></section><section><h2>Saat mengirim masukan</h2><p>Ketika Anda mengirim formulir, browser mengirim pesan, kontak opsional, dan penanda sumber “DYSPAL Website” ke Formspree. Formspree memproses masukan dan dapat menerima data teknis seperti alamat IP untuk mencegah spam. Kolom kontak boleh dikosongkan.</p></section><section><h2>Unduhan dan dukungan</h2><p>Tautan unduhan dan rilis membuka GitHub. Tautan dukungan membuka Trakteer. Setiap layanan menangani kunjungan sesuai kebijakan privasinya. Lirik dalam simulator website adalah contoh. Pencarian lirik online yang dijelaskan di panduan merupakan fitur aplikasi Windows.</p></section><nav aria-label="Halaman website"><a href="../">Dyspal untuk Windows | Kapsul desktop interaktif</a> · <a href="../download/">Unduh Dyspal untuk Windows</a> · <a href="../changelog/">Riwayat rilis Dyspal | Apa yang baru?</a> · <a href="../guide/">Panduan pengguna Dyspal | Mulai di Windows</a> · <a href="../privacy/">Kebijakan privasi website | Dyspal</a></nav></section></noscript></body></html>
