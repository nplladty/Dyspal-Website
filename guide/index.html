<noscript><section aria-label="Panduan pengguna Dyspal | Mulai di Windows"><p><strong>Panduan pengguna Dyspal | Mulai di Windows</strong></p><p>Pelajari cara menjalankan Dyspal, menggunakan kontrol media dan pengingat, serta menyesuaikan kapsul di desktop Windows.</p><section><h2>Unduh dan jalankan</h2><p>Buka halaman Unduh dan pilih Unduh Dyspal. Setelah unduhan selesai, buka berkas aplikasi Dyspal. Kapsul akan muncul di bagian atas desktop.</p><p>Website merekomendasikan Windows 10 atau Windows 11. Kompatibilitas belum diuji pada setiap build Windows.</p></section><section><h2>Menggunakan kapsul</h2><p>Saat beristirahat, kapsul mengecil. Klik kapsul untuk menampilkan kontrolnya. Tampilan ringkas memberikan rangkuman, sedangkan tampilan yang diperluas memberi ruang untuk menggunakan kontrol.</p><p>Klik kanan kapsul dan pilih Settings untuk membuka Control Center.</p></section><section><h2>Media dan lirik tersinkron</h2><p>Putar lagu di pemutar atau browser yang menyediakan sesi media Windows. Perluas kapsul untuk memutar atau menjeda lagu. Kontrol yang tersedia bergantung pada pemutar.</p><p>Pilih Show Lyrics untuk mengikuti baris lirik yang sedang diputar. Dyspal mencari lirik tersinkron yang cocok di LRCLIB melalui internet. Pilih Hide Lyrics untuk kembali ke tampilan yang lebih kecil.</p></section><section><h2>Monitor sistem</h2><p>Buka Hardware Monitor dari kapsul untuk melihat penggunaan CPU dan RAM. Tunggu sejenak hingga sampel pertama muncul sebelum membandingkan aktivitas.</p></section><section><h2>Kalender dan pengingat</h2><p>Buka kalender, pilih tanggal, lalu tampilkan agenda untuk melihat atau menambahkan acara. Atur pengingat jika Anda ingin kapsul mengingatkan Anda tentang acara tersebut.</p><p>Saat pengingat muncul, buka untuk melihat acaranya atau tunda untuk diingatkan lagi nanti. Agenda dan pengingat tersimpan di PC Anda.</p></section><section><h2>Tema dan personalisasi</h2><p>Di Settings, buka Appearance untuk memilih aksen dan beralih antara tampilan bawaan dan Liquid Glass. Sesuaikan opasitas agar kapsul tetap terbaca di atas wallpaper Anda.</p></section><section><h2>Control Center</h2><p>Klik kanan kapsul lalu pilih Settings. Buka Media untuk memilih pemutar, Appearance untuk mengubah tampilan kapsul, atau Motion untuk menyesuaikan animasi. Untuk menutup aplikasi, pilih Exit dari menu Dyspal di baki sistem Windows.</p></section><nav aria-label="Halaman website"><a href="../">Dyspal untuk Windows | Kapsul desktop interaktif</a> · <a href="../download/">Unduh Dyspal untuk Windows</a> · <a href="../changelog/">Riwayat rilis Dyspal | Apa yang baru?</a> · <a href="../guide/">Panduan pengguna Dyspal | Mulai di Windows</a> · <a href="../privacy/">Kebijakan privasi website | Dyspal</a></nav></section></noscript></body>
